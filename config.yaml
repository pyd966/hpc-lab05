engine:
  dtype: bfloat16
  device: cuda
  max_batch_size: 10
  scheduler_batch_size: 10
  max_sequence_length: 2048
  attention_backend: triton_flash
  linear_backend: int4_triton
  scheduler_backend: continuous
  prefill_token_budget: 2048
  seed: 42
  synchronize_metrics: true
  weight_offloading: true
  weight_offloading_prefetch: true
  weight_offloading_pin_memory: true
  weight_resident_mlp: true
  weight_resident_mlp_layers: 44
  ring_kv_cache: true
  paged_kv_cache: true
  paged_kv_block_size: 16
  paged_kv_global_pool_blocks: 776
  paged_kv_sliding_pool_blocks: 530

quantization:
  algorithm: gptq
  version: 1
  bits: 4
  group_size: 64
  symmetric: true
  scale_dtype: float16
  packing: uint8_little_nibble
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  calibration:
    gptq:
      block_size: 128
      damp_percent: 0.01
  propagate_quantized: true

calibration:
  path: datasets/calibration-256.jsonl
  limit: 256
  micro_batch_size: 1
  max_tokens: 4096
